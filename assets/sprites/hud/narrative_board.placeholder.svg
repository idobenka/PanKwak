<svg xmlns="http://www.w3.org/2000/svg" width="560" height="90" viewBox="0 0 560 90">
  <!-- NARRATIVE BOARD — PLACEHOLDER (CATS-114).
       The wooden sign board drawn behind the in-play narrative beat lines at the bottom of
       the lower grass band, so the italic feed lines read over a warm plank panel instead of
       the textured grass. Final art is a bespoke pass; swap this file IN PLACE (same path +
       viewBox) to ship it — no code change. Drawn stretched to the feed width, 9-slice-free:
       keep the outer 8px a plain plank edge so edge stretch stays clean. -->
  <!-- plank panel -->
  <rect x="4" y="6" width="552" height="78" rx="10" fill="#8a5a33"/>
  <rect x="4" y="6" width="552" height="78" rx="10" fill="none" stroke="#6b4423" stroke-width="3"/>
  <!-- horizontal board seams (planks) -->
  <line x1="10" y1="33" x2="550" y2="33" stroke="#6b4423" stroke-width="1.6" opacity="0.7"/>
  <line x1="10" y1="59" x2="550" y2="59" stroke="#6b4423" stroke-width="1.6" opacity="0.7"/>
  <!-- soft wood-grain streaks -->
  <path d="M 40 16 q 30 3 60 0 t 70 2" fill="none" stroke="#a06b3f" stroke-width="2" stroke-linecap="round" opacity="0.55"/>
  <path d="M 210 42 q 40 -3 80 1 t 90 -2" fill="none" stroke="#a06b3f" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <path d="M 120 70 q 35 3 70 -1 t 85 2" fill="none" stroke="#a06b3f" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- two nails, top corners -->
  <circle cx="22" cy="20" r="3.4" fill="#d9c08a" stroke="#5a3a1e" stroke-width="1"/>
  <circle cx="538" cy="20" r="3.4" fill="#d9c08a" stroke="#5a3a1e" stroke-width="1"/>
</svg>
