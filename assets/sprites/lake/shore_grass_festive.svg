<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Shore / grass-bank texture (FAR / PARTY shore, festive variant) — Lake redesign (CATS-67).
       Same flat-soft-rounded family as shore_grass.svg but nudged warmer/golden-green and
       sprinkled with small warm string-light dots that hint at the pool party waiting on the
       far shore (where Pip is rowing to, to Fern). The dots are flat, rounded, soft — no glow,
       no sparkle, no harshness (R7: never a warning read). This is the recommended festive
       variant per CATS-67 §2 ("consider whether the two shores want the same texture or a
       slightly festive variant for the far/party shore").

       Same base geometry as the home-shore tile so the two shores read as one cohesive bank;
       the only deltas are (a) a touch warmer green, and (b) the party-light dots.

       TILEABLE BOTH AXES at 96×96 (edge marks wrap — drawn in matched pairs).

       Recommendation (see README §"Home vs far shore"): USE this festive tile for the far
       (party) shore and shore_grass.svg for the home shore, so the destination visually
       rewards arrival without changing the silhouette language. -->
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="96" height="96"/></clipPath>
  </defs>

  <!-- base bank fill: a touch warmer/golden vs the home shore (#3a7d4f -> #43804f) -->
  <rect x="0" y="0" width="96" height="96" fill="#43804f"/>

  <g clip-path="url(#tile)">
    <!-- soft darker patches (single allowed darker tone), slightly warmer -->
    <g fill="#36693f">
      <ellipse cx="18" cy="70" rx="16" ry="9"/>
      <ellipse cx="74" cy="30" rx="18" ry="10"/>
      <ellipse cx="-6" cy="30" rx="14" ry="8"/>
      <ellipse cx="102" cy="70" rx="14" ry="8"/>
    </g>

    <!-- rounded grass tufts: warmer golden-green accent (warm-light bias) -->
    <g fill="#67a86a">
      <g><ellipse cx="14" cy="20" rx="5" ry="8"/><ellipse cx="18" cy="16" rx="5" ry="9"/><ellipse cx="22" cy="20" rx="5" ry="8"/></g>
      <g><ellipse cx="50" cy="52" rx="5" ry="8"/><ellipse cx="54" cy="48" rx="5" ry="9"/><ellipse cx="58" cy="52" rx="5" ry="8"/></g>
      <g><ellipse cx="-4" cy="84" rx="5" ry="8"/><ellipse cx="0"  cy="80" rx="5" ry="9"/><ellipse cx="4"  cy="84" rx="5" ry="8"/></g>
      <g><ellipse cx="92" cy="84" rx="5" ry="8"/><ellipse cx="96" cy="80" rx="5" ry="9"/><ellipse cx="100" cy="84" rx="5" ry="8"/></g>
    </g>

    <!-- soft pebbles, same as the home tile for cohesion -->
    <g>
      <ellipse cx="38" cy="86" rx="5" ry="3.4" fill="#36693f"/>
      <ellipse cx="37" cy="85" rx="4.2" ry="2.6" fill="#7cbf80"/>
      <ellipse cx="78" cy="12" rx="5" ry="3.4" fill="#36693f"/>
      <ellipse cx="77" cy="11" rx="4.2" ry="2.6" fill="#7cbf80"/>
    </g>

    <!-- PARTY-LIGHT dots: small warm string lights (the festive delta). Flat, rounded, soft.
         Warm amber/gold + a touch of blush, low-ish alpha so they read as ambient twinkle, not
         a warning. NO glow rings, NO sparkle — that would break flat-soft and tip toward alarm.
         Drawn in matched pairs at edges for seamless tiling. -->
    <g>
      <circle cx="30" cy="34" r="2.4" fill="#ffd27a"/>
      <circle cx="62" cy="74" r="2.4" fill="#ffe1a8"/>
      <circle cx="84" cy="44" r="2.4" fill="#f4c0c8"/>
      <circle cx="108" cy="44" r="2.4" fill="#f4c0c8"/>
      <circle cx="6" cy="64" r="2.4" fill="#ffd27a"/>
      <circle cx="-12" cy="64" r="2.4" fill="#ffd27a"/>
      <!-- one lighter crest dot per cluster = warm-light-bias accent -->
      <circle cx="30" cy="33.2" r="1.1" fill="#fff4d6" opacity="0.9"/>
      <circle cx="62" cy="73.2" r="1.1" fill="#fff4d6" opacity="0.9"/>
    </g>
  </g>
</svg>
