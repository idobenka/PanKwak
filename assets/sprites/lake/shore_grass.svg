<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Shore / grass-bank texture (HOME shore) — Lake redesign (CATS-67).
       Flat-soft-rounded vector cartoon (ART_DIRECTION.md §1). Warm-green family anchored on
       the existing graybox shore #3a7d4f (§2). Rounded grass tufts + a few soft pebbles, flat
       fills only: one base color, the single allowed darker tone for a soft underside, and one
       lighter accent for the warm-light bias (top-left). NO soft shading, no harsh points.

       TILEABLE BOTH AXES at 96×96 (edge marks wrap — drawn in matched pairs). Used for the
       home shore and as the base for the far (party) shore variant.

       FIXED tint (shores are NOT tinted in render.js today — solid #3a7d4f rects). Read against
       the sky-landscape band above (day sky #cfe8ff → dusk #5f4878) and the water fill below:
       the warm greens are mid-value, legible on pale day sky and on deep dusk sky alike
       (see README §"Tint survival"). -->
  <defs>
    <clipPath id="tile"><rect x="0" y="0" width="96" height="96"/></clipPath>
  </defs>

  <!-- base bank fill: matches the existing shore color so the swap is a visual upgrade, not a
       redesign (ART_DIRECTION §2 "visual upgrade, not a redesign") -->
  <rect x="0" y="0" width="96" height="96" fill="#3a7d4f"/>

  <g clip-path="url(#tile)">
    <!-- soft darker patches = the single allowed slightly-darker tone (depth, never shadow) -->
    <g fill="#2f6640">
      <ellipse cx="18" cy="70" rx="16" ry="9"/>
      <ellipse cx="74" cy="30" rx="18" ry="10"/>
      <ellipse cx="-6" cy="30" rx="14" ry="8"/>
      <ellipse cx="102" cy="70" rx="14" ry="8"/>
    </g>

    <!-- rounded grass tufts: lighter warm-green lobes = the warm-light-bias accent -->
    <g fill="#4f9763">
      <!-- a tuft = 3 overlapping rounded lobes (rounded silhouettes, no sharp blades) -->
      <g><ellipse cx="14" cy="20" rx="5" ry="8"/><ellipse cx="18" cy="16" rx="5" ry="9"/><ellipse cx="22" cy="20" rx="5" ry="8"/></g>
      <g><ellipse cx="50" cy="52" rx="5" ry="8"/><ellipse cx="54" cy="48" rx="5" ry="9"/><ellipse cx="58" cy="52" rx="5" ry="8"/></g>
      <g><ellipse cx="-4" cy="84" rx="5" ry="8"/><ellipse cx="0"  cy="80" rx="5" ry="9"/><ellipse cx="4"  cy="84" rx="5" ry="8"/></g>
      <g><ellipse cx="92" cy="84" rx="5" ry="8"/><ellipse cx="96" cy="80" rx="5" ry="9"/><ellipse cx="100" cy="84" rx="5" ry="8"/></g>
    </g>

    <!-- a few soft pebbles — flat, rounded, the darker tone + a lighter top (warm-light bias) -->
    <g>
      <ellipse cx="38" cy="86" rx="5" ry="3.4" fill="#2f6640"/>
      <ellipse cx="37" cy="85" rx="4.2" ry="2.6" fill="#5fa97a"/>
      <ellipse cx="78" cy="12" rx="5" ry="3.4" fill="#2f6640"/>
      <ellipse cx="77" cy="11" rx="4.2" ry="2.6" fill="#5fa97a"/>
      <ellipse cx="-2" cy="54" rx="5" ry="3.4" fill="#2f6640"/>
      <ellipse cx="-3" cy="53" rx="4.2" ry="2.6" fill="#5fa97a"/>
      <ellipse cx="94" cy="54" rx="5" ry="3.4" fill="#2f6640"/>
      <ellipse cx="93" cy="53" rx="4.2" ry="2.6" fill="#5fa97a"/>
    </g>
  </g>
</svg>
