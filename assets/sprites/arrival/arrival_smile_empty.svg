<svg xmlns="http://www.w3.org/2000/svg" width="320" height="200" viewBox="0 0 320 200">
  <!-- ARRIVAL-SMILE BEAT — EMPTY-HANDED VARIANT (R7). Pip shows empty palms with an apologetic grin;
       Fern is touched (hand over heart), still warm. One dragonfly STILL settles on her flower —
       the point was never the perfect gift, it was that Pip crossed the lake. Warm anticlimax, NEVER loss. -->
  <defs>
    <linearGradient id="sunsetSky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a7a"/>
      <stop offset="0.45" stop-color="#9a5a6a"/>
      <stop offset="0.8" stop-color="#f3a86b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="320" height="120" fill="url(#sunsetSky2)"/>
  <circle cx="250" cy="104" r="20" fill="#ffd9a0" opacity="0.9"/>
  <rect x="0" y="120" width="320" height="80" fill="#16243f"/>
  <path d="M 0 140 Q 40 137 80 140 Q 120 143 160 140 Q 200 137 240 140 Q 280 143 320 140" fill="none" stroke="#3b4a7a" stroke-width="1.5" opacity="0.6"/>

  <!-- far shore party -->
  <rect x="252" y="96" width="68" height="24" fill="#3a7d4f"/>
  <path d="M 232 92 Q 290 70 318 96" fill="none" stroke="#5a4a2a" stroke-width="1"/>
  <g fill="#ffd98a">
    <circle cx="244" cy="86" r="2.6"/><circle cx="262" cy="80" r="2.8"/><circle cx="282" cy="78" r="2.8"/>
    <circle cx="300" cy="84" r="2.6"/><circle cx="312" cy="92" r="2.4"/>
  </g>
  <rect x="270" y="100" width="9" height="13" rx="2" fill="#e87a6b"/>
  <rect x="0" y="104" width="60" height="16" fill="#3a7d4f"/>

  <!-- FERN — touched pose (hand over heart), her own flower by her, still warm -->
  <g transform="translate(48 120)">
    <ellipse cx="0" cy="-14" rx="15" ry="11" fill="#8fc7a0"/>
    <ellipse cx="0" cy="-10" rx="9" ry="6" fill="#f4f0d6"/>
    <!-- hand over heart -->
    <ellipse cx="2" cy="-12" rx="5" ry="5" fill="#8fc7a0"/>
    <!-- her signature flower, the dragonfly's target -->
    <g transform="translate(16 -24)">
      <circle r="5" fill="#f4e3a1"/>
      <circle cx="-4" cy="0" r="3.4" fill="#ffffff"/>
      <circle cx="4" cy="0" r="3.4" fill="#ffffff"/>
      <circle cx="0" cy="-4" r="3.4" fill="#ffffff"/>
      <circle r="2" fill="#e8b24c"/>
    </g>
    <circle cx="-4" cy="-22" r="3" fill="#ffffff"/>
    <circle cx="5" cy="-22" r="3" fill="#ffffff"/>
    <circle cx="-3.5" cy="-21.5" r="1.5" fill="#1c2740"/>
    <circle cx="5.5" cy="-21.5" r="1.5" fill="#1c2740"/>
    <!-- tender small smile (warm, not pitying) -->
    <path d="M -3 -16 Q 1 -14 4 -16" fill="none" stroke="#5d8f70" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- PIP — empty palms up, apologetic grin, hand behind head. The warm anticlimax. -->
  <g transform="translate(190 150)">
    <ellipse cx="0" cy="6" rx="34" ry="11" fill="#4caf6f"/>
    <ellipse cx="0" cy="4" rx="26" ry="7" fill="#3a8f57"/>
    <ellipse cx="-2" cy="-10" rx="13" ry="10" fill="#bcd65f"/>
    <ellipse cx="-2" cy="-6" rx="8" ry="5.5" fill="#f4f0d6"/>
    <!-- empty palm turned up ("I got nothin'") -->
    <ellipse cx="-16" cy="-12" rx="5" ry="6" transform="rotate(-25 -16 -12)" fill="#bcd65f"/>
    <ellipse cx="-18" cy="-16" rx="4.5" ry="3" fill="#bcd65f"/>
    <!-- hand behind head -->
    <ellipse cx="8" cy="-30" rx="4" ry="5" transform="rotate(40 8 -30)" fill="#bcd65f"/>
    <ellipse cx="-2" cy="-22" rx="11" ry="9" fill="#bcd65f"/>
    <circle cx="-7" cy="-27" r="4.2" fill="#bcd65f"/>
    <circle cx="3" cy="-27" r="4.2" fill="#bcd65f"/>
    <circle cx="-7" cy="-26" r="2.9" fill="#ffffff"/>
    <circle cx="3" cy="-26" r="2.9" fill="#ffffff"/>
    <circle cx="-6.5" cy="-25.5" r="1.4" fill="#1c2740"/>
    <circle cx="3.5" cy="-25.5" r="1.4" fill="#1c2740"/>
    <!-- raised eyebrows + lopsided grin = sheepish, not sad -->
    <path d="M -10 -31 Q -7 -33 -4 -31" fill="none" stroke="#7d9a3a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M 0 -31 Q 3 -33 6 -31" fill="none" stroke="#7d9a3a" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M -6 -20 Q -2 -17 2 -21" fill="none" stroke="#7d9a3a" stroke-width="1.3" stroke-linecap="round"/>
    <!-- comic sweat = "heh" -->
    <path d="M 9 -24 q -1 2 0 3 q 1 -0.6 0 -3" fill="#bfe3f5"/>
  </g>

  <!-- dragonfly still settling on Fern's flower — the beat lands even empty-handed -->
  <path d="M 178 126 Q 150 98 96 102 Q 74 104 64 112" fill="none" stroke="#bff7dd" stroke-width="1.4" stroke-dasharray="2 5" opacity="0.7"/>
  <g transform="translate(64 106)">
    <ellipse cx="0" cy="0" rx="3" ry="2" fill="#9be3c4"/>
    <ellipse cx="-3" cy="-3" rx="3.2" ry="1.6" transform="rotate(-30 -3 -3)" fill="#bff7dd" opacity="0.85"/>
    <ellipse cx="3" cy="-3" rx="3.2" ry="1.6" transform="rotate(30 3 -3)" fill="#bff7dd" opacity="0.85"/>
    <ellipse cx="-3" cy="3" rx="3.2" ry="1.6" transform="rotate(30 -3 3)" fill="#bff7dd" opacity="0.7"/>
    <ellipse cx="3" cy="3" rx="3.2" ry="1.6" transform="rotate(-30 3 3)" fill="#bff7dd" opacity="0.7"/>
    <circle cx="2.4" cy="-0.4" r="0.7" fill="#1c2740"/>
  </g>
</svg>
