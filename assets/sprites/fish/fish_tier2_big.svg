<svg xmlns="http://www.w3.org/2000/svg" width="136" height="96" viewBox="0 0 136 96">
  <!-- Fish tier 2 — BIG. "Gentle, oblivious oaf." The LIGHTEST belly + the dopiest eyes = least threatening. Faces left. -->
  <path d="M 104 48 Q 132 16 126 48 Q 132 80 104 48 Z" fill="#2f5d77"/>
  <!-- body: very chubby, nearly round -->
  <ellipse cx="62" cy="48" rx="50" ry="37" fill="#2f5d77"/>
  <!-- LIGHTEST belly (the key dopier-as-bigger move — defeats the dark-silhouette menace) -->
  <ellipse cx="62" cy="62" rx="36" ry="22" fill="#dfeaf0"/>
  <!-- soft rounded top fin -->
  <path d="M 54 12 Q 70 4 82 18 Q 66 22 54 12 Z" fill="#2f5d77"/>
  <!-- soft rounded bottom fin -->
  <path d="M 54 84 Q 68 93 82 84 Q 68 80 54 84 Z" fill="#2f5d77"/>
  <!-- open dumb mouth -->
  <ellipse cx="16" cy="52" rx="6.5" ry="5" fill="#234a5e"/>
  <!-- the dopiest eyes: huge, heavy lids, tiny off-center pupils = blissfully clueless -->
  <circle cx="30" cy="38" r="10" fill="#ffffff"/>
  <circle cx="50" cy="38" r="10" fill="#ffffff"/>
  <circle cx="31" cy="40" r="2.6" fill="#1c2740"/>
  <circle cx="51" cy="40" r="2.6" fill="#1c2740"/>
  <!-- heavy droopy lids — the vacant contented stare -->
  <path d="M 21 35 Q 30 30 39 35" fill="none" stroke="#234a5e" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 41 35 Q 50 30 59 35" fill="none" stroke="#234a5e" stroke-width="2.2" stroke-linecap="round"/>
  <!-- soft spots, scattered -->
  <circle cx="68" cy="44" r="3.5" fill="#234a5e" opacity="0.45"/>
  <circle cx="84" cy="52" r="3" fill="#234a5e" opacity="0.45"/>
  <circle cx="78" cy="36" r="2.6" fill="#234a5e" opacity="0.45"/>
  <!-- a content little blush = happily snacking with no idea it's ruining your bouquet -->
  <ellipse cx="24" cy="56" rx="5" ry="3" fill="#f2a9a0" opacity="0.4"/>
</svg>
